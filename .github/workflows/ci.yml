name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint-and-test:
    uses: ./.github/workflows/tests.yml
    with:
      profile: ci

  # The production image (deployed on the deoxys cluster by wccomps/wccomps-argocd).
  # PRs only build (to catch a broken Dockerfile); pushes to main also publish to GHCR.
  images:
    needs: lint-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          # One image for web and bot (see Dockerfile)
          images: ghcr.io/${{ github.repository_owner }}/wccomps-portal
          tags: |
            type=sha,format=short
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=wccomps-portal
          cache-to: type=gha,mode=max,scope=wccomps-portal
