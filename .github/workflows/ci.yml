name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint-and-test:
    uses: ./.github/workflows/tests.yml
    with:
      profile: ci

  # The production image (deployed on the deoxys cluster by wccomps/wccomps-argocd).
  # PRs only build (to catch a broken Dockerfile); pushes to main also publish to GHCR.
  images:
    needs: lint-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # One image for web and bot (see Dockerfile)
          images: ghcr.io/${{ github.repository_owner }}/wccomps-portal
          tags: |
            type=sha,format=short
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build (and push on main)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=wccomps-portal
          cache-to: type=gha,mode=max,scope=wccomps-portal
