name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wccomps
          POSTGRES_PASSWORD: wccomps
          POSTGRES_DB: wccomps_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: wccomps
      DB_PASSWORD: wccomps
      DB_NAME: wccomps_test

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: |
          uv sync

      - name: Check code formatting
        run: |
          uv run ruff format --check .

      - name: Run linting
        run: |
          uv run ruff check .

      - name: Run type checking
        run: |
          DJANGO_SETTINGS_MODULE=portal.settings uv run mypy

      - name: Check for unapplied migrations
        run: |
          cd web && DJANGO_SETTINGS_MODULE=portal.settings uv run python manage.py makemigrations --check --dry-run

      - name: Collect static files
        run: |
          cd web && DJANGO_SETTINGS_MODULE=portal.settings uv run python manage.py collectstatic --noinput
        env:
          DJANGO_SECRET_KEY: test-secret-key-for-ci

      - name: Run tests
        run: |
          uv run pytest -m "not browser"
        env:
          PYTHONPATH: ${{ github.workspace }}/web:${{ github.workspace }}
          DJANGO_SECRET_KEY: test-secret-key-for-ci

  # The production image (deployed on the deoxys cluster by wccomps/wccomps-argocd).
  # PRs only build (to catch a broken Dockerfile); pushes to main also publish to GHCR.
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          # One image for web and bot (see Dockerfile)
          images: ghcr.io/${{ github.repository_owner }}/wccomps-portal
          tags: |
            type=sha,format=short
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=wccomps-portal
          cache-to: type=gha,mode=max,scope=wccomps-portal
