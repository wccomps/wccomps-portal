name: Nightly

# A nightly run (deep-properties.yml, nightly-browser.yml): the tests on main, then one issue kept in step with them.
# When they don't pass (a test fails, an earlier step fails, or the job times out) it opens the issue, or comments on
# the open one; when they pass, it closes it. A job that hits timeout-minutes is cancelled, but the run isn't, so the
# report still files it; a run cancelled by someone or by the caller's concurrency group reports nothing. On a PR
# (one touching the caller's paths) it tests the PR's merge commit and prints the issue body instead of sending it.

on:
  workflow_call:
    inputs:
      label:
        description: The label of the issue this run keeps; only github-actions' open issues with it are read or changed
        type: string
        required: true
      browser:
        description: Run the browser tests instead of everything else (tests.yml)
        type: boolean
        default: false
      profile:
        description: The Hypothesis profile (conftest.py)
        type: string
        default: ci
      timeout-minutes:
        description: How long the tests may run
        type: number
        required: true

permissions:
  contents: read
  issues: write

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
    with:
      browser: ${{ inputs.browser }}
      profile: ${{ inputs.profile }}
      lint: false
      # The nightly and manual runs test main; a PR's run tests the PR's merge commit (an empty ref). Written this
      # way round because an empty string is false in an expression: "pull_request && '' || 'main'" is always 'main'
      ref: ${{ github.event_name != 'pull_request' && 'main' || '' }}
      timeout-minutes: ${{ inputs.timeout-minutes }}

  report:
    needs: tests
    # After the tests whatever happened to them, but not when someone cancelled the run
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_TITLE: ${{ github.workflow }} failed
      ISSUE_LABEL: ${{ inputs.label }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SHA: ${{ needs.tests.outputs.sha || github.sha }}
      RESULT: ${{ needs.tests.result }}
      DRY_RUN: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The report script is 3.14 syntax; the runner's own python3 is older
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: test-results

      - name: Open, update or close the failure issue
        run: |
          python .github/scripts/nightly_report.py test-results.xml "$RUN_URL" "$SHA" > issue-body.md
          if [ "$DRY_RUN" = "true" ]; then
            echo "Tests: $RESULT. The issue body a failing night would send:"
            cat issue-body.md
            exit 0
          fi
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --author app/github-actions \
            --label "$ISSUE_LABEL" --json number --jq '.[0].number // empty')
          if [ "$RESULT" = "success" ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "Passed at $SHA: $RUN_URL"
            fi
          elif [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file issue-body.md
          else
            gh label create "$ISSUE_LABEL" --repo "$GITHUB_REPOSITORY" --force --color B60205 \
              --description "Opened and closed by a nightly run"
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" --label "$ISSUE_LABEL" \
              --body-file issue-body.md
          fi
