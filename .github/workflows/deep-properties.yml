name: Nightly deep property tests

# The ci profile runs the same few Hypothesis examples on every PR; this runs the deep profile (many random
# examples, conftest.py) on main every night and on demand. When a run doesn't pass (a test fails, an earlier step
# fails, or the job times out) it opens one issue, or comments on the open one; when a run passes, it closes it.
# A PR that edits this workflow, tests.yml or the report script runs it with the ci profile and prints the issue
# body it would send instead of sending it.

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/deep-properties.yml
      - .github/workflows/tests.yml
      - .github/scripts/deep_report.py

permissions:
  contents: read
  issues: write

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
    with:
      profile: ${{ github.event_name == 'pull_request' && 'ci' || 'deep' }}
      lint: false
      # The night's run tests main; a PR's run tests the PR
      ref: ${{ github.event_name == 'pull_request' && '' || 'main' }}

  report:
    needs: tests
    if: always()
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_TITLE: "Nightly deep property tests failed"
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SHA: ${{ needs.tests.outputs.sha || github.sha }}
      RESULT: ${{ needs.tests.result }}
      DRY_RUN: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: test-results-${{ github.event_name == 'pull_request' && 'ci' || 'deep' }}

      - name: Open, update or close the failure issue
        run: |
          python3 .github/scripts/deep_report.py test-results.xml "$RUN_URL" "$SHA" > issue-body.md
          if [ "$DRY_RUN" = "true" ]; then
            echo "Tests: $RESULT. The issue body a failing night would send:"
            cat issue-body.md
            exit 0
          fi
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$ISSUE_TITLE\" in:title" \
            --json number,title --jq 'map(select(.title == $ENV.ISSUE_TITLE)) | .[0].number // empty')
          if [ "$RESULT" = "success" ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "Passed at $SHA: $RUN_URL"
            fi
          elif [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file issue-body.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" --body-file issue-body.md
          fi
