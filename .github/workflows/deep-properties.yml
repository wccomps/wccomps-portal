name: Nightly deep property tests

# The ci profile runs the same few Hypothesis examples on every PR; this runs the deep profile (many random
# examples, conftest.py) on main every night and on demand (nightly.yml). A PR touching the paths below runs it with
# the ci profile and prints the issue body it would send instead.

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/deep-properties.yml
      - .github/workflows/nightly.yml
      - .github/workflows/tests.yml
      - .github/scripts/nightly_report.py

permissions:
  contents: read
  issues: write

# The nightly and manual runs one at a time, so two can't both open an issue; each PR's dry run has a group of its own
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  nightly:
    uses: ./.github/workflows/nightly.yml
    with:
      label: nightly-deep-properties
      profile: ${{ github.event_name == 'pull_request' && 'ci' || 'deep' }}
      timeout-minutes: 300
