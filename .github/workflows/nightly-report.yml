name: Nightly report

# The report step of a nightly run (deep-properties.yml, nightly-browser.yml): when the tests didn't pass (a test
# failed, an earlier step failed, or the job timed out) it opens one issue, or comments on the open one; when they
# passed, it closes it. A dry run (a PR touching the workflows) prints the issue body it would send instead.

on:
  workflow_call:
    inputs:
      title:
        description: The issue's title
        type: string
        required: true
      label:
        description: The label marking the issue this run keeps (opened by github-actions, so no one else's is touched)
        type: string
        required: true
      result:
        description: The tests job's result (success, failure, cancelled)
        type: string
        required: true
      sha:
        description: The commit the tests ran on
        type: string
        required: true
      results:
        description: The name of the artifact holding the tests' JUnit XML
        type: string
        default: ""
      dry-run:
        description: Print the issue body instead of sending it
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_TITLE: ${{ inputs.title }}
      ISSUE_LABEL: ${{ inputs.label }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SHA: ${{ inputs.sha }}
      RESULT: ${{ inputs.result }}
      DRY_RUN: ${{ inputs.dry-run }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The report script is 3.14 syntax; the runner's own python3 is older
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: ${{ inputs.results }}

      - name: Open, update or close the failure issue
        run: |
          python .github/scripts/nightly_report.py test-results.xml "$RUN_URL" "$SHA" > issue-body.md
          if [ "$DRY_RUN" = "true" ]; then
            echo "Tests: $RESULT. The issue body a failing night would send:"
            cat issue-body.md
            exit 0
          fi
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --author app/github-actions \
            --label "$ISSUE_LABEL" --json number --jq '.[0].number // empty')
          if [ "$RESULT" = "success" ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "Passed at $SHA: $RUN_URL"
            fi
          elif [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file issue-body.md
          else
            gh label create "$ISSUE_LABEL" --repo "$GITHUB_REPOSITORY" --force \
              --description "Opened and closed by a nightly run"
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" --label "$ISSUE_LABEL" \
              --body-file issue-body.md
          fi
