# Dependency upgrades arrive as reviewable PRs.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # The Dockerfile's images: uv's (the build's installer) and Python's
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The Python version changes by a PR to .python-version, with the Dockerfile's tag (test_python_pin)
      - dependency-name: python
