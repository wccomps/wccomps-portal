{% extends "scoring/base.html" %}
{% load cotton %}
{% block title %}
    Review Incident Reports
{% endblock title %}
{% block scoring_content %}
    <script>
    document.addEventListener('alpine:init', () => {
        Alpine.data('incidentsBulkSelect', () => bulkSelectMixin('incident-id', 'incident'));
    });
    </script>
    <c-page_header title="Review Incident Reports" />
    <c-module filtered="true" id="changelist">
        <c-filter_toolbar form_id="changelist-filter"
                          hx_get="{% url 'scoring:review_incidents' %}"
                          hx_target="#review-incidents-content"
                          hx_swap="outerHTML"
                          hx_push_url="true">
            {% if has_pending %}
                <c-slot name="actions">
                    <c-button type="submit" form="bulk-approve-form" variant="primary">
                        Approve Selected
                    </c-button>
                </c-slot>
            {% endif %}
            <c-approval_filter value="{{ filters.status }}" />
            <c-team_filter :numbers="team_numbers" value="{{ chosen_team|default_if_none:'' }}" />
            <c-filter_field label="Box" id="id_box" min_width="120px">
                <input type="text"
                       name="box"
                       id="id_box"
                       value="{{ filters.box|default:'' }}"
                       placeholder="Box name..."
                       aria-label="Filter by box">
            </c-filter_field>
            <c-filter_field label="Search" id="id_search" min_width="180px">
                <input type="text"
                       name="search"
                       id="id_search"
                       value="{{ filters.search }}"
                       placeholder="Search..."
                       aria-label="Search incidents">
            </c-filter_field>
        </c-filter_toolbar>
        {% include "scoring/partials/review_incidents_table.html" %}
    </c-module>
{% endblock scoring_content %}
