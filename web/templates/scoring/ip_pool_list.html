{% extends "scoring/red_base.html" %}
{% block title %}
    IP Pools
{% endblock title %}
{% block red_content %}
    {% load cotton %}
    <c-page_header title="IP Pools" subtitle="Manage your rotating source IP pools" />
    <c-module filtered="true">
        <c-slot name="toolbar">
            <c-link href="{% url 'scoring:ip_pool_create' %}" variant="add">Create Pool</c-link>
        </c-slot>
        <c-filter_toolbar form_id="ip-pool-filter"
                          hx_get="{% url 'scoring:ip_pool_list' %}"
                          hx_target="#ip-pool-list-content"
                          hx_swap="outerHTML"
                          hx_push_url="true">
            <c-filter_field label="Search" id="id_search">
                <input type="text"
                       name="search"
                       id="id_search"
                       value="{{ filters.search }}"
                       placeholder="Pool name or IP..."
                       aria-label="Search IP pools" />
            </c-filter_field>
        </c-filter_toolbar>
        {% include "scoring/partials/ip_pool_table.html" %}
    </c-module>
{% endblock red_content %}
