{% extends "scoring/white_team_base.html" %}
{% block white_team_content %}
    <script>
    document.addEventListener('alpine:init', () => {
        Alpine.data('clearableForm', () => ({
            clearForm() { this.$el.querySelectorAll("input[name^='points_team_']").forEach(i => i.value = ''); }
        }));
    });
    </script>
    {% load cotton %}
    <c-page_header title="Inject Grading" />
    <c-module>
        {% if not quotient_available %}
            <c-empty_state title="Quotient Unavailable"
                           description="Unable to connect to the scoring engine. Check the API URL and credentials." />
        {% elif no_injects %}
            <c-empty_state title="No injects"
                           description="No injects are configured in Quotient yet." />
        {% else %}
            <c-form_field label="Select Inject" id="inject-select">
                <select id="inject-select"
                        class="vTextField"
                        hx-get="{% url 'scoring:inject_grading' %}"
                        hx-target="#inject-grading-content"
                        hx-swap="outerHTML"
                        hx-push-url="true"
                        hx-include="this"
                        name="inject">
                    <option value="">Select an inject to grade</option>
                    {% for id, title in inject_choices %}
                        <option value="{{ id }}"
                                {% if id == selected_inject_id %}selected{% endif %}>{{ title }}</option>
                    {% endfor %}
                </select>
            </c-form_field>
            {% include "scoring/partials/inject_grading_content.html" %}
        {% endif %}
    </c-module>
{% endblock white_team_content %}
