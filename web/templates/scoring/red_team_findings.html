{% extends "scoring/red_base.html" %}
{% load cotton %}
{% block title %}
    All Findings - Red Team
{% endblock title %}
{% block red_content %}
    <c-page_header title="All Findings" />
    <c-module filtered="true" id="changelist">
        <c-filter_toolbar form_id="changelist-filter"
                          hx_get="{% url 'scoring:red_team_scores' %}"
                          hx_target="#red-findings-content"
                          hx_swap="outerHTML"
                          hx_push_url="true">
            <c-approval_filter value="{{ filters.status }}" />
            <c-team_filter :numbers="team_numbers" value="{{ filters.team }}" label="Target Team" />
            <c-filter_field label="Attack Type" id="id_attack_type" min_width="150px">
                <select name="attack_type"
                        id="id_attack_type"
                        aria-label="Filter by attack type">
                    <option value="">All Attack Types</option>
                    {% for attack_type in available_attack_types %}
                        <option value="{{ attack_type.id }}"
                                {% if filters.attack_type == attack_type.id|stringformat:"s" %}selected{% endif %}>
                            {{ attack_type.name }}
                        </option>
                    {% endfor %}
                </select>
            </c-filter_field>
            <c-filter_field label="Submitter" id="id_submitter">
                <select name="submitter" id="id_submitter" aria-label="Filter by submitter">
                    <option value="">All Submitters</option>
                    {% for user in available_submitters %}
                        <option value="{{ user.id }}"
                                {% if filters.submitter == user.id|stringformat:"s" %}selected{% endif %}>
                            {{ user.username }}
                        </option>
                    {% endfor %}
                </select>
            </c-filter_field>
        </c-filter_toolbar>
        {% include "scoring/partials/red_findings_table.html" %}
    </c-module>
{% endblock red_content %}
