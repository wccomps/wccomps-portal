{% extends "admin/base_site.html" %}
{% load cotton %}
{% block title %}
    Incident Reports
{% endblock title %}
{% block content %}
    <div id="content-main">
        <c-page_header title="Incident Reports" />
        <c-module filtered="true">
            <c-slot name="toolbar">
                <c-link href="{% url 'scoring:submit_incident_report' %}" variant="add">Submit New Incident</c-link>
            </c-slot>
            <c-filter_toolbar form_id="incident-list-filter"
                              hx_get="{% url 'scoring:incident_list' %}"
                              hx_target="#incident-list-content"
                              hx_swap="outerHTML"
                              hx_push_url="true">
                <c-approval_filter value="{{ filters.status }}" />
                <c-filter_field label="Search" id="id_search">
                    <input type="text"
                           name="search"
                           id="id_search"
                           value="{{ filters.search }}"
                           placeholder="Description, service, or IP..."
                           aria-label="Search incidents" />
                </c-filter_field>
            </c-filter_toolbar>
            {% include "scoring/partials/incident_list_table.html" %}
        </c-module>
    </div>
{% endblock content %}
