{% extends "registration/admin_base.html" %}
{% load cotton %}
{% block title %}
    Seasons - WCComps Portal
{% endblock title %}
{% block registration_content %}
    <div id="content-main">
        <c-page_header title="Seasons" />
        <c-module filtered="true">
            <c-slot name="toolbar">
                <c-link href="{% url 'registration_season_create' %}" variant="add">Create Season</c-link>
            </c-slot>
            <c-filter_toolbar form_id="seasons-filter"
                              hx_get="{% url 'registration_season_list' %}"
                              hx_target="#seasons-list-content"
                              hx_swap="outerHTML"
                              hx_push_url="true">
                <c-filter_field label="Status" id="id_status">
                    <select name="status" id="id_status" aria-label="Filter by status">
                        <option value="" {% if not filters.status %}selected{% endif %}>All</option>
                        <option value="active" {% if filters.status == "active" %}selected{% endif %}>Active</option>
                        <option value="inactive"
                                {% if filters.status == "inactive" %}selected{% endif %}>Inactive</option>
                    </select>
                </c-filter_field>
                <c-filter_field label="Search" id="id_search">
                    <input type="text"
                           name="search"
                           id="id_search"
                           value="{{ filters.search }}"
                           placeholder="Season name or year..."
                           aria-label="Search seasons" />
                </c-filter_field>
            </c-filter_toolbar>
            {% include "registration/seasons/table.html" %}
        </c-module>
    </div>
{% endblock registration_content %}
