{% extends "registration/admin_base.html" %}
{% load cotton %}
{% block title %}
    {{ season.name }} Events - WCComps Portal
{% endblock title %}
{% block registration_content %}
    <div id="content-main">
        <c-page_header title="{{ season.name }} Events"
                       parent_url="{% url 'registration_season_list' %}"
                       parent_label="Seasons" />
        <c-module filtered="true">
            <c-slot name="toolbar">
                <c-link href="{% url 'registration_event_create' season_id=season.id %}"
                        variant="add">Create Event</c-link>
            </c-slot>
            <c-filter_toolbar form_id="events-filter"
                              hx_get="{% url 'registration_event_list' season_id=season.id %}"
                              hx_target="#events-list-content"
                              hx_swap="outerHTML"
                              hx_push_url="true">
                <c-filter_field label="Type" id="id_event_type">
                    <select name="event_type" id="id_event_type" aria-label="Filter by event type">
                        <option value="">All Types</option>
                        {% for value, label in event_type_choices %}
                            <option value="{{ value }}"
                                    {% if value == filters.event_type %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </c-filter_field>
                <c-filter_field label="Search" id="id_search">
                    <input type="text"
                           name="search"
                           id="id_search"
                           value="{{ filters.search }}"
                           placeholder="Event name..."
                           aria-label="Search events" />
                </c-filter_field>
            </c-filter_toolbar>
            {% include "registration/events/table.html" %}
        </c-module>
    </div>
{% endblock registration_content %}
