{% extends "registration/admin_base.html" %}
{% load cotton %}
{% block title %}
    Review Registrations - WCComps Portal
{% endblock title %}
{% block registration_content %}
    <div id="content-main">
        <c-page_header title="Team Registration Review" />
        <c-module filtered="true">
            <c-filter_toolbar hx_get="{% url 'registration_review_list' %}"
                              hx_target="#registration-review-content"
                              hx_swap="outerHTML"
                              hx_push_url="true">
                <c-filter_field label="Status" id="id_status">
                    <select name="status" id="id_status" aria-label="Filter by status">
                        <option value="">All Statuses</option>
                        {% for value, label in status_choices %}
                            <option value="{{ value }}"
                                    {% if value == status_filter %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </c-filter_field>
            </c-filter_toolbar>
            {% include "registration/review_table.html" %}
        </c-module>
    </div>
{% endblock registration_content %}
