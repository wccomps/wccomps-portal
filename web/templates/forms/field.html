{# A form's field as a form row (field.as_field_group, set by core.form_renderer) #}
{% load cotton %}
<c-form_field label="{{ field.label }}"
              required="{% if field.field.required %}true{% else %}false{% endif %}"
              id="{{ field.id_for_label }}"
              describe_id="{{ field.auto_id }}"
              help_text="{{ field.help_text }}"
              error="{{ field.errors|join:' ' }}"
              layout="{% if field.use_fieldset %}group{% elif field.widget_type == 'checkbox' %}checkbox{% endif %}"
              describedby="{{ field.aria_describedby|default:'' }}">
    {{ field }}
</c-form_field>
