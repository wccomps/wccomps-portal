{% load cotton %}
{# BoxPicker (ticketing/forms.py): a toggle button per box, and the picked box's name in a hidden input #}
<div class="d-flex flex-wrap gap-10">
    {% for box_name in widget.box_names %}
        <c-toggle_button @click="selectHostname"
                         data-hostname="{{ box_name }}"
                         pressed="{% if box_name == widget.value %}true{% else %}false{% endif %}">
            {{ box_name }}
        </c-toggle_button>
    {% endfor %}
</div>
{% include "django/forms/widgets/input.html" %}
