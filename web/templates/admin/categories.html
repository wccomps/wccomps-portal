{% extends "admin/ops_base.html" %}
{% load cotton %}
{% block title %}
    Ticket Categories - WCComps Portal
{% endblock title %}
{% block admin_content %}
    <c-page_header title="Ticket Categories" />
    <c-module filtered="true">
        <c-slot name="toolbar">
            <c-link href="{% url 'admin_category_create' %}" variant="add">Add Category</c-link>
        </c-slot>
        <c-filter_toolbar form_id="categories-filter"
                          hx_get="{% url 'admin_categories' %}"
                          hx_target="#categories-list-content"
                          hx_swap="outerHTML"
                          hx_push_url="true">
            <c-filter_field label="Visibility" id="id_visibility">
                <select name="visibility"
                        id="id_visibility"
                        aria-label="Filter by visibility">
                    <option value="" {% if not filters.visibility %}selected{% endif %}>All</option>
                    <option value="visible"
                            {% if filters.visibility == "visible" %}selected{% endif %}>User Visible</option>
                    <option value="hidden"
                            {% if filters.visibility == "hidden" %}selected{% endif %}>Hidden</option>
                </select>
            </c-filter_field>
            <c-filter_field label="Search" id="id_search">
                <input type="text"
                       name="search"
                       id="id_search"
                       value="{{ filters.search }}"
                       placeholder="Category name or playbook..."
                       aria-label="Search categories" />
            </c-filter_field>
        </c-filter_toolbar>
        {% include "admin/categories_table.html" %}
    </c-module>
{% endblock admin_content %}
