{% extends "admin/ops_base.html" %}
{% load cotton %}
{% block title %}
    Team Management - WCComps Portal
{% endblock title %}
{% block admin_content %}
    <div x-data="teamsAdmin">
        <c-page_header title="Team Management" />
        <c-module>
            <c-slot name="title">
                Bulk Actions
            </c-slot>
            <form @submit.prevent="bulkAction"
                  :data-confirm="bulkQuestion"
                  class="d-flex gap-10 items-end flex-wrap p-10">
                <c-filter_field label="Team Numbers" id="bulk_team_numbers">
                    <input type="text"
                           id="bulk_team_numbers"
                           name="team_numbers"
                           :value="bulkTeamNumbers"
                           @input="setField"
                           data-field="bulkTeamNumbers"
                           class="vTextField"
                           placeholder="1,3,5-10,15">
                </c-filter_field>
                <c-filter_field label="Action" id="bulk_action">
                    <select id="bulk_action"
                            name="action"
                            :value="bulkActionType"
                            @change="setField"
                            data-field="bulkActionType"
                            class="vTextField">
                        <option value="activate">Activate</option>
                        <option value="deactivate">Deactivate</option>
                        <option value="recreate">Recreate Channels</option>
                    </select>
                </c-filter_field>
                <c-button type="submit" variant="default" ::disabled="loading">
                    Execute
                </c-button>
            </form>
        </c-module>
        <c-module class="mt-5" filtered="true">
            <c-filter_toolbar form_id="teams-filter"
                              hx_get="{% url 'admin_teams' %}"
                              hx_target="#teams-list-content"
                              hx_swap="outerHTML"
                              hx_push_url="true">
                <c-filter_field label="Status" id="id_status">
                    <select name="status" id="id_status" aria-label="Filter by status">
                        <option value="" {% if not filters.status %}selected{% endif %}>All</option>
                        <option value="active" {% if filters.status == "active" %}selected{% endif %}>Active</option>
                        <option value="inactive"
                                {% if filters.status == "inactive" %}selected{% endif %}>Inactive</option>
                    </select>
                </c-filter_field>
                <c-filter_field label="Discord" id="id_discord">
                    <select name="discord" id="id_discord" aria-label="Filter by Discord status">
                        <option value="" {% if not filters.discord %}selected{% endif %}>All</option>
                        <option value="configured"
                                {% if filters.discord == "configured" %}selected{% endif %}>Configured</option>
                        <option value="not_set"
                                {% if filters.discord == "not_set" %}selected{% endif %}>Not Set</option>
                    </select>
                </c-filter_field>
                <c-filter_field label="Search" id="id_search">
                    <input type="text"
                           name="search"
                           id="id_search"
                           value="{{ filters.search }}"
                           placeholder="Team number or name..."
                           aria-label="Search teams" />
                </c-filter_field>
            </c-filter_toolbar>
            {% include "admin/teams_table.html" %}
        </c-module>
        <c-toast />
    </div>
    <script>
    document.addEventListener('alpine:init', () => {
        Alpine.data('teamsAdmin', () => compose(actionMixin('{% url "admin_teams_bulk_action" %}'), {
                bulkTeamNumbers: '',
                bulkActionType: 'activate',

                // No team numbers asks nothing: bulkAction says what's missing
                get bulkQuestion() {
                    if (!this.bulkTeamNumbers) return '';
                    const verb = { activate: 'Activate', deactivate: 'Deactivate', recreate: 'Recreate channels for' };
                    return `${verb[this.bulkActionType]} teams ${this.bulkTeamNumbers}?`;
                },
                bulkAction() {
                    if (!this.bulkTeamNumbers) {
                        this.message = 'Please enter team numbers';
                        this.messageType = 'error';
                        return;
                    }
                    this.doAction(this.bulkActionType, { team_numbers: this.bulkTeamNumbers });
                }
            }));
    });
    </script>
{% endblock admin_content %}
