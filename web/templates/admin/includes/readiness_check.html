{# The readiness check's button and streamed results; include it inside a component composed with readinessMixin #}
{% load cotton %}
<c-button_row>
    <c-button variant="default"
              @click="runReadinessChecks"
              ::disabled="readinessLoading">
        <span x-show="notReadinessLoading">Run Checks</span>
        <span x-show="readinessLoading">Running...</span>
    </c-button>
</c-button_row>
<template x-if="hasReadinessResults">
    <c-table id="readiness_list"
             class="w-full mt-15"
             aria_label="Readiness check results">
        <c-slot name="headers">
            <tr>
                <c-table_header sortable="false">
                    Check
                </c-table_header>
                <c-table_header sortable="false">
                    Result
                </c-table_header>
                <c-table_header sortable="false">
                    Detail
                </c-table_header>
                <c-table_header sortable="false">
                    Fix
                </c-table_header>
            </tr>
        </c-slot>
        <template x-for="(r, idx) in readinessResults" :key="idx">
            <tr>
                <td x-text="r.step"></td>
                <td>
                    <c-badge variant=""
                             ::class="r.resultClass"
                             x-text="r.resultLabel" />
                </td>
                <td x-text="r.detail"></td>
                <td>
                    <template x-if="r.isLinkAction">
                        <c-link ::href="r.actionUrl" x-text="r.actionLabel" />
                    </template>
                    <template x-if="r.isFixAction">
                        <c-button variant="warning"
                                  @click="doReadinessFix"
                                  ::data-fix="r.fixKey"
                                  ::disabled="readinessFixing"
                                  x-text="r.actionLabel" />
                    </template>
                </td>
            </tr>
        </template>
    </c-table>
</template>
<template x-if="readinessOk">
    <c-alert variant="success" class="mt-15">
        <span x-text="readinessSummary"></span>
    </c-alert>
</template>
<template x-if="readinessNotOk">
    <c-alert variant="warning" class="mt-15">
        <span x-text="readinessSummary"></span>
    </c-alert>
</template>
