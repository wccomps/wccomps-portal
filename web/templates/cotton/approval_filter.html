{# Approval status filter component - the review lists' ?status= select (core.utils.by_approval) #}
{# Usage: <c-approval_filter value="{{ filters.status }}" /> #}
{# Props: value (the status chosen) #}
<c-vars value="" />
<c-filter_field label="Status" id="id_status">
    <select name="status" id="id_status" aria-label="Filter by status" {{ attrs }}>
        <option value="pending" {% if value == "pending" %}selected{% endif %}>Pending Only</option>
        <option value="approved" {% if value == "approved" %}selected{% endif %}>Approved Only</option>
        <option value="all" {% if value == "all" %}selected{% endif %}>All</option>
    </select>
</c-filter_field>
