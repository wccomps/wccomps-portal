{# Toggle button: stays pressed while its choice is picked; its script (togglePicker, or the page's) calls setTogglePressed (static/js/utils.js) #}
{# Usage: <c-toggle_button data-value="web01">web01</c-toggle_button> #}
{# Props: pressed (bool, the initial state), class (additional classes) #}
<c-vars pressed="false" class="" />
<button type="button"
        {{ attrs }}
        aria-pressed="{% if pressed == 'true' %}true{% else %}false{% endif %}"
        class="button {% if pressed == 'true' %}box-toggle--selected {% endif %}{{ class }}">
    {{ slot }}
</button>
