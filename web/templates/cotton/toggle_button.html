{# Toggle button: stays pressed while its choice is picked; its look follows aria-pressed #}
{# Usage: <c-toggle_button data-value="web01">web01</c-toggle_button> #}
{# Props: pressed (bool, the initial state), class (additional classes) #}
<c-vars pressed="false" class="" />
<button type="button"
        {{ attrs }}
        aria-pressed="{% if pressed == 'true' %}true{% else %}false{% endif %}"
        class="button toggle-button {{ class }}">
    {{ slot }}
</button>
