{# Usage: <c-button variant="primary" type="submit">Save</c-button> #}
{# Props: variant (default|primary|secondary|danger|warning|cancel), type (button|submit), class (additional classes), id, name, value, form #}
<c-vars variant="default"
        type="button"
        class
        id
        name=""
        value=""
        form="" />
<button type="{{ type }}"
        {% if id %}id="{{ id }}"{% endif %}
        {% if name %}name="{{ name }}"{% endif %}
        {% if value %}value="{{ value }}"{% endif %}
        {% if form %}form="{{ form }}"{% endif %}
        {{ attrs }}
        class="{% if variant == 'secondary' or variant == 'cancel' %}btn-secondary {{ class }}{% else %}button {{ class }} {% if variant == 'primary' %}default {% elif variant == 'danger' %}danger {% elif variant == 'warning' %}warning {% endif %}{% endif %}">
    {{ slot }}
</button>
