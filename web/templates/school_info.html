{% extends "admin/ops_base.html" %}
{% load static cotton %}
{% block title %}
    School Information - WCComps Portal
{% endblock title %}
{% block admin_content %}
    <div id="content-main">
        <c-page_header title="School Information" />
        <c-module id="changelist" filtered="true">
            <c-slot name="toolbar">
                <c-link href="{% url 'school_info_export' %}">Export CSV</c-link>
                <c-link href="{% url 'school_info_import' %}" variant="add">Import from CSV</c-link>
            </c-slot>
            <c-filter_toolbar form_id="school-info-filter"
                              hx_get="{% url 'school_info' %}"
                              hx_target="#school-info-content"
                              hx_swap="outerHTML"
                              hx_push_url="true">
                <c-filter_field label="Status" id="id_status">
                    <select name="status" id="id_status" aria-label="Filter by status">
                        <option value="" {% if not filters.status %}selected{% endif %}>All</option>
                        <option value="configured"
                                {% if filters.status == "configured" %}selected{% endif %}>Configured</option>
                        <option value="not_set"
                                {% if filters.status == "not_set" %}selected{% endif %}>Not Set</option>
                    </select>
                </c-filter_field>
                <c-filter_field label="Search" id="id_search">
                    <input type="text"
                           name="search"
                           id="id_search"
                           value="{{ filters.search }}"
                           placeholder="School, email, or team..."
                           aria-label="Search school information" />
                </c-filter_field>
            </c-filter_toolbar>
            {% include "school_info_table.html" %}
            <c-button_row class="mt-20 justify-end">
                <c-link href="{% url 'school_info_clear' %}" variant="danger">Clear All</c-link>
            </c-button_row>
        </c-module>
    </div>
{% endblock admin_content %}
