{% extends "orange_team/base.html" %}
{% load cotton %}
{% block orange_title %}
    Review Queue - Orange Team
{% endblock orange_title %}
{% block orange_content %}
    <c-page_header title="Review Queue" subtitle="Submitted assignments awaiting review" />
    <c-module filtered="true">
        <c-slot name="toolbar">
            <c-link href="{% url 'orange_team:export_scores' %}" variant="default">Export CSV</c-link>
        </c-slot>
        <c-filter_toolbar form_id="orange-review-filter"
                          hx_get="{% url 'orange_team:review_queue' %}"
                          hx_target="#orange-review-content"
                          hx_swap="outerHTML"
                          hx_push_url="true">
            <c-filter_field label="Status" id="id_status">
                <select name="status" id="id_status" aria-label="Filter by status">
                    <option value="" {% if not filters.status %}selected{% endif %}>All</option>
                    <option value="submitted"
                            {% if filters.status == "submitted" %}selected{% endif %}>Submitted</option>
                    <option value="in_progress"
                            {% if filters.status == "in_progress" %}selected{% endif %}>In Progress</option>
                </select>
            </c-filter_field>
            <c-team_filter :numbers="team_numbers" value="{{ chosen_team|default_if_none:'' }}" />
            <c-filter_field label="Search" id="id_search">
                <input type="text"
                       name="search"
                       id="id_search"
                       value="{{ filters.search }}"
                       placeholder="Check or assignee..."
                       aria-label="Search review queue" />
            </c-filter_field>
        </c-filter_toolbar>
        {% include "orange_team/review_table.html" %}
    </c-module>
{% endblock orange_content %}
