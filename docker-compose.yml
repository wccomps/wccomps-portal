# Run the portal with Docker: Postgres, the web app, the worker and (with the chat profile) the chat process: the
# Discord bot, the Zulip runner, or both.
#   cp .env.example .env    # fill it in
#   docker compose up -d     # published image; `docker compose up -d --build` runs this checkout
#   docker compose --profile chat up -d   # also the chat process, once DISCORD_BOT_TOKEN or the ZULIP_* trio is set
# The web app listens on http://localhost:${WEB_PORT:-8000}; put it behind an HTTPS reverse proxy
# (with DJANGO_DEBUG=False the session and CSRF cookies are HTTPS-only).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-wccomps}
      POSTGRES_USER: ${DB_USER:-wccomps}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    command: >
      postgres
      -c max_connections=120
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-wccomps}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: ghcr.io/wccomps/wccomps-portal:${PORTAL_TAG:-main}
    build: .
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      # Any HTTP answer means gunicorn is up (and migrations are done): a Host header outside
      # ALLOWED_HOSTS gets a 400 (HTTPError), which is still an answer. A refused connection fails.
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.error, urllib.request
          try:
              urllib.request.urlopen("http://localhost:8000/livez/", timeout=4)
          except urllib.error.HTTPError:
              pass
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s

  worker:
    # Same image; skip its entrypoint (migrations are web's job) and run the periodic jobs and the worker queue.
    image: ghcr.io/wccomps/wccomps-portal:${PORTAL_TAG:-main}
    entrypoint: []
    working_dir: /app
    command: ["python", "-m", "worker"]
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "core.health", "worker"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  chat:
    # Same image; skip its entrypoint and run the chat backends configured in .env (Discord: DISCORD_BOT_TOKEN; Zulip:
    # ZULIP_SITE, ZULIP_BOT_EMAIL and ZULIP_API_KEY). Run exactly one chat process per deployment.
    profiles: [chat]
    image: ghcr.io/wccomps/wccomps-portal:${PORTAL_TAG:-main}
    entrypoint: []
    working_dir: /app
    command: ["python", "-m", "chat"]
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "core.health", "chat"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  postgres_data:
