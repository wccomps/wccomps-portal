# Run the portal with Docker: Postgres, the web app and the Discord bot.
#   cp .env.example .env    # fill it in
#   docker compose up -d     # published image; `docker compose up -d --build` runs this checkout
# The web app listens on http://localhost:${WEB_PORT:-8000}; put it behind an HTTPS reverse proxy
# (with DJANGO_DEBUG=False the session and CSRF cookies are HTTPS-only).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-wccomps}
      POSTGRES_USER: ${DB_USER:-wccomps}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    command: >
      postgres
      -c max_connections=120
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-wccomps}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: ghcr.io/wccomps/wccomps-portal:${PORTAL_TAG:-main}
    build: .
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      # Any HTTP answer means gunicorn is up (and migrations are done): a Host header outside
      # ALLOWED_HOSTS gets a 400 (HTTPError), which is still an answer. A refused connection fails.
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.error, urllib.request
          try:
              urllib.request.urlopen("http://localhost:8000/livez/", timeout=4)
          except urllib.error.HTTPError:
              pass
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s

  bot:
    # Same image; skip its entrypoint (migrations are web's job) and run the bot instead.
    # Exactly one bot may run per Discord token.
    image: ghcr.io/wccomps/wccomps-portal:${PORTAL_TAG:-main}
    entrypoint: []
    working_dir: /app
    command: ["python", "main.py"]
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
