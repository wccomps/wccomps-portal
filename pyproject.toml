[project]
name = "wccomps-portal"
version = "1.0.0"
description = "WCComps Portal: web portal and Discord bot for WCComps competition management"
requires-python = ">=3.14"
dependencies = [
    # Discord bot
    "discord.py>=2.4.0",
    # Django web app
    "django>=5.1.14,<6.2",
    "django-cotton>=0.9",
    # settings.py calls django_stubs_ext.monkeypatch() so generic Django classes subscript at runtime
    "django-stubs-ext>=5.1.1",
    "gunicorn>=21.2",
    "whitenoise>=6.6",
    # Shared dependencies
    "psycopg2-binary>=2.9.9",
    "xkcdpass>=1.19.9",
    "httpx>=0.28.1",
    "weasyprint>=63.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bot", "web"]

[dependency-groups]
dev = [
    "ruff>=0.14.0",
    "pytest>=7.4",
    "pytest-django>=4.7",
    "pytest-asyncio>=0.21",
    "playwright>=1.40.0",
    "hypothesis[django]>=6.100",
    "mypy>=1.13",
    "django-stubs>=5.1.1",
    "djlint>=1.36.4",
    "pytest-xdist>=3.8.0",
]

[tool.mypy]
python_version = "3.14"
plugins = ["mypy_django_plugin.main"]
mypy_path = "web"
# mypy 2 defaults to a SQLite cache, which fails with "disk I/O error" on virtiofs (no WAL shared memory)
sqlite_cache = false
files = ["bot", "web/core", "web/team", "web/ticketing", "web/quotient", "web/portal", "web/scoring", "web/orange_team", "web/packets", "web/registration"]
exclude = "(/tests/|/test_|tests\\.py|conftest\\.py)"

# Strict type checking
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_configs = true
warn_no_return = true
warn_return_any = true
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_any_explicit = true
disallow_subclassing_any = true
disallow_any_unimported = false
no_implicit_optional = true
no_implicit_reexport = true
strict_optional = true
strict_equality = true
extra_checks = true

# Output
show_error_codes = true
pretty = true
color_output = true

# Performance
incremental = true
cache_dir = ".mypy_cache"

# Imports
follow_imports = "normal"
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = "xkcdpass.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "psycopg2.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "*.migrations.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "weasyprint"
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "portal.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "portal.test_settings"
pythonpath = ["web"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
testpaths = ["bot/tests", "web/core/tests", "web/scoring/tests", "web/team/tests", "web/packets/tests", "web/registration/tests", "web/orange_team/tests", "web/ticketing/tests", "web/browser_tests"]
addopts = ["--tb=short", "-n", "6", "--dist", "worksteal"]
markers = [
    "browser: Browser-based UI tests using Playwright",
]

[tool.djlint]
profile = "django"
indent = 4
max_line_length = 120
format_css = true
format_js = false  # Disabled: breaks Django template tags inside <script>
# H030/H031: meta description/keywords are SEO tags - not applicable to emails or PDFs
# H053: duplicate ids - false positives from cotton id props (<c-filter_field id=...>) and <c-vars id>,
#       which djlint counts as HTML ids alongside the element they end up on
ignore = "H030,H031,H053"

[tool.djlint.per-file-ignores]
# Cotton: <c-vars class id> declares props (not HTML attrs); inline styles use template variables
"cotton/" = "H021,H026"
# &#10; is the only way to put newlines in a placeholder attribute
"packets/ops_upload_packet.html" = "H023"

[tool.ruff]
target-version = "py314"
line-length = 120
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "*.pyc",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    "migrations",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes (unused imports, undefined names, etc.)
    "I",      # isort (import sorting)
    "UP",     # pyupgrade (modern Python syntax)
    "B",      # flake8-bugbear (common mistakes)
    "C4",     # flake8-comprehensions (better list/dict comprehensions)
    "PIE",    # flake8-pie (misc lints)
    "SIM",    # flake8-simplify (simplification suggestions)
    "T10",    # flake8-debugger (no forgotten breakpoints)
    "N",      # pep8-naming (naming conventions)
    "Q",      # flake8-quotes (consistent quotes)
    "S",      # flake8-bandit (security issues)
    "ASYNC",  # flake8-async (async/await correctness)
    "DTZ",    # flake8-datetimez (timezone awareness)
    "ERA",    # eradicate (no commented-out code)
    "PTH",    # flake8-use-pathlib (use pathlib)
    "PERF",   # performance improvements
]
ignore = [
    "E402",    # module level import not at top (django.setup pattern)
    "DTZ007",  # strptime without %z (we parse naive then add timezone)
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "S110", "S311"]
"**/test_*.py" = ["S101", "S105", "S106", "S110", "S311"]
"**/tests.py" = ["S101", "S105", "S106", "S110", "S311"]
"**/conftest.py" = ["S101", "S105", "S106", "S110", "S311"]

[tool.ruff.lint.isort]
known-first-party = ["bot", "web", "core", "team", "ticketing"]

